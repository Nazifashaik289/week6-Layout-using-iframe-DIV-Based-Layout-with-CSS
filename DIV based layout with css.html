<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>DIV Layout</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { font-family: Arial, sans-serif; }
 .header { background:#420635; color:#fff; padding:20px; text-align:center; }
 .nav { background:#70435d; padding:10px; text-align:center; }
 .nav a { color:#dbd2a6; margin:0 15px; text-decoration:none; }
 .container { display:flex; }
 .sidebar { background:#d8a9c8; color:#310526; width:25%; padding:15px; min-height:250px; }
 .content { background:#f7f5f3; width:75%; padding:15px; color:#3b371f;}
 .footer { background:#70435d; color:#dfeca4; text-align:center; padding:10px; }
</style>
</head>
<body>
 <div class="header"><h1>My College Website</h1></div>
 <div class="nav">
 <a href="#">Home</a><a href="#">Courses</a><a href="#">Contact</a>
 </div>
 <div class="container">
 <div class="sidebar">
 <h3>Menu</h3>
 <p>Departments</p>
 <p>Faculty</p>
 <p>Admissions</p>
 </div>
 <div class="content">
 <h2>Welcome</h2>
 <p>This layout is built using DIV elements and CSS Flexbox.</p>
 </div>
 </div>
 <div class="footer"><p>&copy; 2025 My College</p></div>
</body>
</html>
